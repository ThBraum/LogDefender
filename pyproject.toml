[tool.poetry]
name = "logdefender"
version = "0.1.0"
description = "Project that replicates a defensive log analyzer for SOC/Blue Team portfolio."
authors = [
    "Matheus Braum <mtbraum@gmail.com>"
]
readme = "README.md"
packages = [{ include = "logdefender" }]

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.12.3"
click = "8.1.7"
rich = "^13.8.0"
pydantic = "^2.8.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"

[tool.poetry.scripts]
logdefender = "logdefender.cli:app"
